name: Build hyprlock

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y \
            cmake pkg-config g++-14 patchelf \
            libpixman-1-dev libpugixml-dev \
            libdrm-dev libcairo2-dev libpango1.0-dev \
            libjpeg-dev libwebp-dev libmagic-dev libpng-dev librsvg2-dev \
            libwayland-dev wayland-protocols \
            libxkbcommon-dev libpam0g-dev \
            libegl1-mesa-dev libgles2-mesa-dev libgbm-dev \
            libsystemd-dev
          echo "CC=gcc-14" >> $GITHUB_ENV
          echo "CXX=g++-14" >> $GITHUB_ENV

      # ---- Hypr ecosystem libs (from source) ----

      # Install all Hypr ecosystem libs to a custom prefix so we can
      # precisely identify which .so files to bundle.
      - name: Build hyprutils
        run: |
          git clone --depth=1 https://github.com/hyprwm/hyprutils.git /tmp/hyprutils
          cmake -S /tmp/hyprutils -B /tmp/hyprutils/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/hyprlibs
          cmake --build /tmp/hyprutils/build -j$(nproc)
          sudo cmake --install /tmp/hyprutils/build

      - name: Build hyprlang
        run: |
          export PKG_CONFIG_PATH="/opt/hyprlibs/lib/x86_64-linux-gnu/pkgconfig:/opt/hyprlibs/lib/pkgconfig:$PKG_CONFIG_PATH"
          git clone --depth=1 https://github.com/hyprwm/hyprlang.git /tmp/hyprlang
          cmake -S /tmp/hyprlang -B /tmp/hyprlang/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/hyprlibs
          cmake --build /tmp/hyprlang/build -j$(nproc)
          sudo cmake --install /tmp/hyprlang/build

      - name: Build hyprwayland-scanner
        run: |
          git clone --depth=1 https://github.com/hyprwm/hyprwayland-scanner.git /tmp/hyprwayland-scanner
          cmake -S /tmp/hyprwayland-scanner -B /tmp/hyprwayland-scanner/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/hyprlibs
          cmake --build /tmp/hyprwayland-scanner/build -j$(nproc)
          sudo cmake --install /tmp/hyprwayland-scanner/build

      - name: Build sdbus-cpp
        run: |
          git clone --depth=1 --branch v2.0.0 https://github.com/Kistler-group/sdbus-cpp.git /tmp/sdbus-cpp
          cmake -S /tmp/sdbus-cpp -B /tmp/sdbus-cpp/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/hyprlibs \
            -DBUILD_CODE_GEN=OFF
          cmake --build /tmp/sdbus-cpp/build -j$(nproc)
          sudo cmake --install /tmp/sdbus-cpp/build

      - name: Build hyprgraphics
        run: |
          export PKG_CONFIG_PATH="/opt/hyprlibs/lib/x86_64-linux-gnu/pkgconfig:/opt/hyprlibs/lib/pkgconfig:$PKG_CONFIG_PATH"
          git clone --depth=1 https://github.com/hyprwm/hyprgraphics.git /tmp/hyprgraphics
          cmake -S /tmp/hyprgraphics -B /tmp/hyprgraphics/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/hyprlibs
          cmake --build /tmp/hyprgraphics/build -j$(nproc)
          sudo cmake --install /tmp/hyprgraphics/build

      # ---- Build hyprlock ----

      - name: Build hyprlock
        run: |
          export PATH="/opt/hyprlibs/bin:$PATH"
          export PKG_CONFIG_PATH="/opt/hyprlibs/lib/x86_64-linux-gnu/pkgconfig:/opt/hyprlibs/lib/pkgconfig:$PKG_CONFIG_PATH"
          cmake --no-warn-unused-cli \
            -DCMAKE_BUILD_TYPE:STRING=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/hyprlibs \
            -S . -B ./build
          cmake --build ./build --config Release --target hyprlock -j$(nproc)

      - name: Bundle binary with shared libs
        run: |
          # Debug: find the built binary
          echo "--- Looking for hyprlock binary ---"
          find ./build -name 'hyprlock' -type f 2>/dev/null
          ls -lh ./build/hyprlock 2>/dev/null || echo "NOT FOUND at ./build/hyprlock"

          mkdir -p ./release/libs

          # Copy binary (fail loudly if missing)
          cp -v ./build/hyprlock ./release/hyprlock

          # Copy all .so files from our custom prefix
          cp -v -L /opt/hyprlibs/lib/x86_64-linux-gnu/lib*.so* ./release/libs/ 2>/dev/null || true
          cp -v -L /opt/hyprlibs/lib/lib*.so* ./release/libs/ 2>/dev/null || true

          # Also grab any non-system libs that hyprlock still needs
          ldd ./build/hyprlock | awk '/=>/ {print $3}' | while read lib; do
            case "$lib" in
              /lib/*|/usr/lib/*|"") ;;
              *) cp -v -L "$lib" ./release/libs/ 2>/dev/null ;;
            esac
          done

          # Deduplicate
          cd ./release/libs && ls -1 | sort | uniq -d | xargs -r rm -f

          # Set RPATH
          patchelf --set-rpath '$ORIGIN/libs' ./release/hyprlock

          # Debug
          echo "--- Bundled libs ---"
          ls -lh ./release/libs/
          echo "--- ldd check ---"
          ldd ./release/hyprlock

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: hyprlock-linux-x86_64
          path: ./release/
          if-no-files-found: error
